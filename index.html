<title>Pokedex Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;color:#2c3e50;min-height:100vh}
.hdr{background:linear-gradient(135deg,#DC0A2D,#8B0000);padding:max(env(safe-area-inset-top),16px) 16px 10px;color:#fff;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.hdr h1{font-size:18px;font-weight:800;letter-spacing:.05em}
.hdr .sub{font-size:11px;opacity:.85;margin-top:2px}
.pbar{margin:6px auto 0;max-width:340px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:#fff;border-radius:3px;transition:width .4s}
.swrap{max-width:340px;margin:8px auto 0;position:relative}
.swrap input{width:100%;padding:8px 34px 8px 10px;border-radius:20px;border:none;font-size:14px;font-family:inherit;font-weight:500;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.1);-webkit-appearance:none}
.sclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#ccc;border:none;width:20px;height:20px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;cursor:pointer;display:none;line-height:20px;text-align:center}
.sclear.show{display:block}
.sflts{display:flex;gap:4px;justify-content:center;margin-top:6px;padding-bottom:2px}
.sbtn{padding:3px 9px;border-radius:15px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:9px;font-weight:700;cursor:pointer;font-family:inherit}
.sbtn.act{background:rgba(255,255,255,.4)}
.toggle-more{display:block;margin:6px auto 0;background:none;border:none;color:rgba(255,255,255,.7);font-size:9px;font-weight:700;cursor:pointer;font-family:inherit;padding:2px 10px}
.extra-panel{display:none;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.15)}
.extra-panel.open{display:block}
.pills{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.pill{padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;border:none;font-family:inherit}
.pill.complete{background:rgba(255,255,255,.95);color:#DC0A2D}
.stats{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.stats span{font-size:9px;font-weight:700;opacity:.85}
.fltrs{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap;padding:0 6px}
.fbtn{padding:3px 8px;border-radius:20px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.fbtn.act{background:#fff;color:#DC0A2D;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 6px;max-width:600px;margin:0 auto}
@media(min-width:500px){.grid{grid-template-columns:repeat(4,1fr)}}
.crd{background:#e8ecf0;border-radius:10px;padding:7px 5px 5px;text-align:center;cursor:pointer;position:relative;opacity:.5;border:3px solid transparent;user-select:none;-webkit-touch-callout:none;transition:all .15s}
.crd.caught{background:#fff;opacity:1;box-shadow:0 1px 5px rgba(0,0,0,.08);border-color:#DC0A2D}
.crd.verzameld{background:#fff;opacity:1;box-shadow:0 1px 5px rgba(0,0,0,.08);border-color:#27ae60}
.crd.fav{opacity:.85}
.crd.caught.fav{background:#fff;opacity:1}
.crd.verzameld.fav{background:#fff;opacity:1}
.crd.skip{background:#f5f5f5;opacity:.35;border-color:#ccc;border-style:dashed}
.crd.skip img{filter:grayscale(100%)}
.crd.skip .nm{text-decoration:line-through;color:#aaa}
.crd.skip .bdg{display:flex;background:#ccc}
.crd.artpick{background:#f5f0ff;opacity:.9;border-color:#8B2FC9}
.crd.artpick .bdg{display:flex;background:#8B2FC9}
.crd.artpick img{filter:none}
.crd .photo-dot{position:absolute;bottom:2px;left:3px;width:12px;height:12px;border-radius:50%;display:none;background:#8B2FC9;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:800}
.crd.has-photo .photo-dot{display:flex}
.crd .bdg{position:absolute;top:2px;right:3px;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:800}
.crd.caught .bdg{display:flex;background:#DC0A2D}
.crd.verzameld .bdg{display:flex;background:#27ae60}
.crd .star{position:absolute;top:2px;left:3px;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;background:#f0c040;color:#fff;font-size:10px;font-weight:800;line-height:1}
.crd.fav .star{display:flex}
.crd img{width:50px;height:50px;object-fit:contain;filter:grayscale(100%);transition:filter .2s}
.crd.caught img,.crd.verzameld img,.crd.fav img{filter:none}
.crd .nm{font-weight:700;font-size:10px;margin-top:2px;line-height:1.1}
.crd .nu{font-weight:600;font-size:8px;color:#8899aa;margin-top:1px}
.crd .gl{font-size:7px;font-weight:700;margin-top:1px}
.crd .mt{font-size:7px;font-weight:800;margin-top:2px;display:none}
.crd.caught .mt{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.crd .mt .src-tag{padding:1px 6px;border-radius:6px;font-size:7px;font-weight:800;color:#fff}
.crd .mt .src-pulled{background:#27ae60}
.crd .mt .src-bought{background:#e67e22}
.crd .mt .src-traded{background:#3498db}
.crd .mt .pr{padding:1px 6px;border-radius:6px;font-size:7px;font-weight:800;background:#3498db;color:#fff}
.crd .db{position:absolute;bottom:2px;right:3px;padding:1px 5px;border-radius:8px;font-size:7px;font-weight:800;background:#e67e22;color:#fff;display:none}
.crd.has-dbl .db{display:block}
.btn-pdf{padding:6px 14px;border-radius:20px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px}
.md .dbl-section{margin-top:6px;padding-top:6px;border-top:2px solid #f0f0f0}
.md .dbl-section .dbl-title{font-size:8px;font-weight:800;color:#e67e22;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.md .cnt-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:4px}
.md .cnt-row button{width:28px;height:28px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#666}
.md .cnt-row .cv{font-size:16px;font-weight:800;min-width:24px;text-align:center}
.empty{text-align:center;padding:30px;color:#8899aa;display:none}
.empty.show{display:block}
.empty .t{font-size:13px;font-weight:700}
.rst{text-align:center;padding:16px 0 calc(30px + env(safe-area-inset-bottom))}
.rst button{padding:6px 16px;border-radius:20px;border:2px solid #ddd;background:#fff;color:#999;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
/* Modal */
.mo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:10px;overflow-y:auto}
.mo.show{display:flex}
.md{background:#fff;border-radius:12px;padding:12px;max-width:280px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative;margin:auto}
.md .cx{position:absolute;top:6px;right:10px;background:none;border:none;font-size:18px;cursor:pointer;color:#aaa;font-weight:300}
.md .pk{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.md .pk img{width:50px;height:50px;object-fit:contain;flex-shrink:0}
.md .pk .pk-info{text-align:left}
.md .pk .pn{font-weight:800;font-size:14px}
.md .pk .pnu{font-weight:600;font-size:10px;color:#8899aa}
.md .tgl{display:flex;gap:4px;margin-bottom:6px}
.md .tgl button{flex:1;padding:6px 2px;border-radius:8px;font-size:9px;font-weight:800;cursor:pointer;font-family:inherit;border:2px solid #e0e0e0;background:#fff;color:#666}
.md .tgl .ca{border-color:#27ae60;background:#e8f8ef;color:#27ae60}
.md .tgl .ua{border-color:#DC0A2D;background:#fde8ea;color:#DC0A2D}
.md .fld{margin-bottom:6px}
.md .fld label{display:block;font-size:8px;font-weight:800;color:#888;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.md .fld input{width:100%;padding:6px 8px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:inherit;font-weight:500;outline:none}
.md .fld input:focus{border-color:#DC0A2D}
.md .src{display:flex;gap:4px}
.md .src button{flex:1;padding:6px;border-radius:8px;border:2px solid #e0e0e0;background:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.md .src .ap{border-color:#27ae60;background:#e8f8ef;color:#27ae60}
.md .src .ab{border-color:#e67e22;background:#fef5e7;color:#e67e22}
.md .src .at{border-color:#3498db;background:#e8f0fe;color:#3498db}
.md .fvb{display:flex;gap:4px;margin-bottom:6px}
.md .fvb button{flex:1;padding:6px;border-radius:8px;border:2px solid #e0e0e0;background:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.md .fvb .fa{border-color:#f0c040;background:#fff9e6;color:#b8860b}
.md .sv{width:100%;padding:8px;border-radius:8px;border:none;background:#DC0A2D;color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
.geninfo{font-size:12px;font-weight:800;color:#fff;text-align:center;padding:8px 12px;margin:6px 0 2px;border-radius:8px;letter-spacing:.03em}
.hs-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:#2c3e50;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:300;text-align:center;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.hs-banner.show{display:block}
.hs-banner .hs-txt{font-size:12px;font-weight:600;line-height:1.4}
.hs-banner .hs-txt b{color:#f0c040}
.hs-banner .hs-close{position:absolute;top:8px;right:12px;background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer}
.multi-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.15);z-index:150;text-align:center}
.multi-bar.show{display:block}
.multi-bar .mb-count{font-size:12px;font-weight:800;color:#2c3e50;margin-bottom:8px}
.multi-bar .mb-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.multi-bar .mb-btns button{padding:8px 14px;border-radius:10px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.mb-caught{background:#DC0A2D;color:#fff}
.mb-fav{background:#f0c040;color:#fff}
.mb-unfav{background:#e0e0e0;color:#666}
.mb-uncaught{background:#fde8ea;color:#DC0A2D}
.mb-cancel{background:#f0f0f0;color:#888}
.multi-toggle{padding:6px 14px;border-radius:20px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.multi-toggle.active{background:#fff;color:#DC0A2D;border-color:#fff}
.crd.multi-selected{outline:3px solid #3498db;outline-offset:-3px}
/* Dashboard */
.dash{max-width:600px;margin:0 auto;padding:8px}
.dash-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.dash-card{flex:1;min-width:80px;background:#fff;border-radius:10px;padding:8px 6px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.dash-card .dc-val{font-size:16px;font-weight:800;color:#2c3e50}
.dash-card .dc-lbl{font-size:8px;font-weight:700;color:#8899aa;text-transform:uppercase;margin-top:1px}
.dash-card.dc-green .dc-val{color:#27ae60}
.dash-card.dc-red .dc-val{color:#DC0A2D}
.dash-card.dc-orange .dc-val{color:#e67e22}
.dash-card.dc-blue .dc-val{color:#3498db}
.gen-bar{display:flex;gap:3px;flex-wrap:wrap}
.gen-chip{flex:1;min-width:55px;padding:4px;border-radius:8px;text-align:center;font-size:8px;font-weight:700;cursor:pointer;border:2px solid #e0e0e0;background:#fff;color:#666;font-family:inherit}
.gen-chip.act{border-color:#DC0A2D;background:#fde8ea;color:#DC0A2D}
.gen-chip .gc-name{display:block}
.gen-chip .gc-prog{display:block;font-size:10px;font-weight:800;color:#2c3e50;margin-top:1px}
.gen-chip.act .gc-prog{color:#DC0A2D}
.gen-chip.complete{border-color:#27ae60;background:#e8f8ef}
.gen-chip.complete .gc-prog{color:#27ae60}
.dash-actions{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dash-actions button{padding:6px 12px;border-radius:8px;border:none;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.wl-bar{display:none;max-width:600px;margin:0 auto 4px;padding:6px 8px;background:#fff9e6;border-radius:10px;border:2px solid #f0c040}
.wl-bar.show{display:block}
.wl-bar .wl-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.wl-bar .wl-lbl{font-size:8px;font-weight:800;color:#b8860b;text-transform:uppercase}
.wl-bar .wl-btn{padding:4px 8px;border-radius:6px;border:2px solid #e0c878;background:#fff;font-size:9px;font-weight:700;cursor:pointer;font-family:inherit;color:#666}
.wl-bar .wl-btn.act{background:#f0c040;color:#fff;border-color:#f0c040}
.wl-bar input{width:60px;padding:4px 6px;border:2px solid #e0c878;border-radius:6px;font-size:10px;font-family:inherit;font-weight:600;outline:none;text-align:center}
.wl-bar input:focus{border-color:#f0c040}
</style>
</head>
<body>
<div class="hdr">
<h1>POKEDEX TRACKER</h1>
<p class="sub" id="sub"></p>
<div class="pbar"><div class="pfill" id="pf"></div></div>
<div class="swrap"><input type="text" id="si" placeholder="Zoek op naam of nummer..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button class="sclear" id="sc">x</button></div>
<div class="sflts" id="sf"></div>
<button class="multi-toggle" id="multiToggle">Multi-select</button>
<button class="multi-toggle" id="photoToggle">Toon foto's</button>
</div>
<div class="dash">
<div class="dash-row" id="dashStats"></div>
<div class="dash-row" id="dashStats2"></div>
<div class="gen-bar" id="gf"></div>
<div class="dash-actions">
</div>
</div>
<div class="wl-bar" id="wlBar" style="max-width:600px;margin:6px auto">
<div class="wl-row">
<span class="wl-lbl">Sorteer:</span>
<button class="wl-btn" id="wlSortCheap">Goedkoop eerst</button>
<button class="wl-btn" id="wlSortExp">Duur eerst</button>
<button class="wl-btn" id="wlSortAz">A-Z</button>
<span class="wl-lbl" style="margin-left:6px">Range:</span>
<input type="text" id="wlMin" placeholder="0" inputmode="decimal">
<span style="font-size:9px;font-weight:700;color:#999">-</span>
<input type="text" id="wlMax" placeholder="999" inputmode="decimal">
<span style="font-size:9px;font-weight:700;color:#b8860b">€</span>
<button class="wl-btn" id="wlRangeGo">Filter</button>
<button class="wl-btn" id="wlRangeReset">Reset</button>
</div>
<div class="wl-row" style="margin-top:4px" id="wlSetRow">
<span class="wl-lbl">Set:</span>
<div id="wlSets" style="display:flex;gap:3px;flex-wrap:wrap"></div>
</div>
<div class="wl-row" style="margin-top:4px;justify-content:space-between;align-items:center">
<div id="wlSummary" style="font-size:10px;font-weight:800;color:#b8860b"></div>
<button class="wl-btn act" id="wlPdf" style="background:#e67e22;color:#fff;border-color:#e67e22">Exporteer wishlist PDF</button>
</div>
</div>
<div class="grid" id="gr"></div>
<div class="empty" id="em"><p class="t">Geen Pokemon gevonden</p></div>
<div class="rst">
<button id="expBtn" style="padding:6px 16px;border-radius:20px;border:2px solid #27ae60;background:#e8f8ef;color:#27ae60;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:6px">Backup exporteren</button>
<button id="impBtn" style="padding:6px 16px;border-radius:20px;border:2px solid #3498db;background:#e8f0fe;color:#3498db;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:6px">Backup importeren</button>
<button id="rb" style="padding:6px 16px;border-radius:20px;border:2px solid #ddd;background:#fff;color:#999;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit">Alles resetten</button>
<input type="file" id="impFile" accept=".json" style="display:none">
</div>
<div class="multi-bar" id="multiBar">
<div class="mb-count" id="mbCount">0 geselecteerd</div>
<div class="mb-btns">
<button class="mb-caught" id="mbCaught">Gevangen</button>
<button class="mb-fav" id="mbDef" style="background:#27ae60">Verzameld</button>
<button class="mb-fav" id="mbFav">Wishlist</button>
<button class="mb-cancel" id="mbAp" style="background:#8B2FC9;color:#fff">Art Pick</button>
<button class="mb-cancel" id="mbSkip" style="background:#ccc;color:#666">Niet sparen</button>
<button class="mb-uncaught" id="mbUncaught">Reset</button>
<button class="mb-cancel" id="mbCancel">Annuleer</button>
</div>
</div>
<div class="mo" id="mov"><div class="md" id="mdl">
<button class="cx" id="mcx">x</button>
<div class="pk"><img id="mi" src=""><div class="pk-info"><div class="pn" id="mn"></div><div class="pnu" id="mnu"></div></div></div>
<div class="tgl" style="flex-wrap:wrap;gap:3px"><button id="bu" style="flex:1 1 22%">Geen</button><button id="bc" style="flex:1 1 22%">Gevangen</button><button id="bd" style="flex:1 1 22%;border-color:#27ae60">Verzameld</button><button id="bap" style="flex:1 1 22%;border-color:#8B2FC9">Art Pick</button><button id="bsk" style="flex:1 1 45%;border-color:#ccc">Skip</button></div>
<div style="display:flex;gap:4px;margin-bottom:6px"><button id="bf" style="flex:1;padding:6px;border-radius:8px;border:2px solid #e0e0e0;background:#fff;font-size:9px;font-weight:800;cursor:pointer;font-family:inherit;color:#666">Wishlist: UIT</button></div>
<div id="wf" style="display:none"><div class="fld"><label>Gewenste set(s) - meerdere met komma</label><input type="text" id="mws" placeholder="bv. 151, Evolving Skies"></div><div class="fld"><label>Geschatte kost (€)</label><input type="text" id="mwp" placeholder="bv. 5.00" inputmode="decimal"></div></div>
<div id="cf">
<div class="fld"><label>Herkomst</label><div class="src"><button id="bp">Getrokken</button><button id="bb">Gekocht</button><button id="bt">Geruild</button></div></div>
</div>
<div style="margin-top:6px;padding-top:6px;border-top:2px solid #f0f0f0">

if(items.length===0){alert("Geen wishlist kaarten om te exporteren.");return}
var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
var pw=210,ph=297,mx=8,my=8;
// Header
doc.setFillColor(240,192,64);doc.rect(0,0,pw,28,"F");
doc.setTextColor(255,255,255);doc.setFontSize(16);doc.setFont("helvetica","bold");
doc.text("WISHLIST",pw/2,12,{align:"center"});
var ttv=0;items.forEach(function(it){ttv+=parseFloat(it.price)||0});
doc.setFontSize(9);doc.setFont("helvetica","normal");
var ft=items.length+" kaarten | Totaal: "+String.fromCharCode(8364)+Math.round(ttv);
if(wlSet)ft+=" | Set: "+wlSet;
doc.text(ft,pw/2,19,{align:"center"});
doc.setFontSize(7);doc.text(new Date().toLocaleDateString("nl-BE"),pw/2,24,{align:"center"});
// Card grid: 3 columns
var cols=3,cw=(pw-mx*2)/cols,ch=52,gap=3;
var cx=mx,cy=32;
var loaded=0,total=items.length;
function drawCard(doc,it,x,y,cw,ch){
doc.setFillColor(255,252,240);doc.setDrawColor(240,192,64);doc.setLineWidth(0.4);
doc.roundedRect(x,y,cw,ch,2,2,"FD");
// Name
doc.setTextColor(40,40,40);doc.setFont("helvetica","bold");doc.setFontSize(9);
doc.text(it.name,x+cw/2,y+4.5,{align:"center",maxWidth:cw-4});
// Number + Gen
doc.setFont("helvetica","normal");doc.setFontSize(6);doc.setTextColor(130,130,130);
doc.text("#"+(it.num<10?"000"+it.num:(it.num<100?"00"+it.num:(it.num<1000?"0"+it.num:""+it.num)))+" | "+it.gen,x+cw/2,y+8,{align:"center"});
// Set
if(it.set){doc.setFontSize(5.5);doc.setTextColor(139,47,201);
doc.text(it.set,x+cw/2,y+ch-8,{align:"center",maxWidth:cw-4})}
// Price
if(it.price){doc.setFontSize(8);doc.setFont("helvetica","bold");doc.setTextColor(230,126,34);
doc.text("~"+it.price+String.fromCharCode(8364),x+cw/2,y+ch-3,{align:"center"})}
}
function addPage(){doc.addPage();doc.setFillColor(240,192,64);doc.rect(0,0,pw,8,"F");doc.setFontSize(6);doc.setTextColor(255,255,255);doc.text("WISHLIST",pw/2,5.5,{align:"center"});cy=12;cx=mx}
// First pass: draw all cards, add images where available
var imgPromises=[];
items.forEach(function(it,idx){
if(cy+ch>ph-10){addPage()}
drawCard(doc,it,cx,cy,cw-gap,ch);
// Add photo or sprite
var imgX=cx+(cw-gap)/2-12;var imgY=cy+9.5;var imgW=24;var imgH=24;
if(it.photo){try{doc.addImage(it.photo,"JPEG",imgX,imgY,imgW,imgH)}catch(e){}}
cx+=cw;
if((idx+1)%cols===0){cx=mx;cy+=ch+gap}
});
// Footer on each page
var np=doc.internal.getNumberOfPages();
for(var i=1;i<=np;i++){doc.setPage(i);doc.setFontSize(6);doc.setTextColor(170,170,170);doc.text("Wishlist Pokemon TCG",mx,ph-4);doc.text("Pagina "+i+"/"+np,pw-mx,ph-4,{align:"right"})}
doc.save("wishlist_"+new Date().toISOString().slice(0,10)+".pdf")});
